load_module /usr/local/lib/instana/ngx_otel_module.so;

events {}

error_log /dev/stdout info;

http {
  error_log /dev/stdout info;
  access_log /dev/stdout;

  otel_exporter {
    endpoint instana-collector:4317;
  }

  otel_service_name "nginx-otel-proxy";

  # Hash the session cookie to produce a consistent per-session sampling decision.
  # Replace $cookie_sessionid with the cookie name your application uses.
  # Adjust the percentage to control the overall sampling rate.
  split_clients $cookie_sessionid $session_sampler {
    10%  on;
    *    off;
  }

  upstream backend {
    server server-app:8080;
  }

  server {
    error_log /dev/stdout info;
    listen 10080;
    server_name localhost;

    location /nginx_status {
      stub_status on;
      access_log off;
      otel_trace off;
      allow all;
    }

    location / {
      otel_trace         $session_sampler;
      otel_trace_context propagate;

      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;

      proxy_pass http://backend;
    }
  }
}
