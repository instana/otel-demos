load_module /usr/local/lib/instana/ngx_otel_module.so;

events {}

error_log /dev/stdout info;

http {
  error_log /dev/stdout info;
  access_log /dev/stdout;

  otel_exporter {
    endpoint instana-collector:4317;
  }

  otel_service_name "nginx-otel-proxy";

  upstream backend {
    server server-app:8080;
  }

  server {
    error_log /dev/stdout info;
    listen 10080;
    server_name localhost;

    otel_trace on;

    # nginx status endpoint — tracing suppressed for this location.
    location /nginx_status {
      stub_status on;
      access_log off;
      otel_trace off;
      allow all;
    }

    location / {
      otel_trace_context propagate;

      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;

      proxy_pass http://backend;
    }
  }
}
