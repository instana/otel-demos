load_module /usr/local/lib/instana/ngx_otel_module.so;

events {}

error_log /dev/stdout info;

http {
  error_log /dev/stdout info;
  access_log /dev/stdout;

  otel_exporter {
    endpoint instana-collector:4317;
  }

  otel_service_name "nginx-otel-proxy";

  upstream backend {
    server server-app:8080;
  }

  server {
    error_log /dev/stdout info;
    listen 10080;
    server_name localhost;

    # Server-level default: all locations are traced.
    otel_trace on;

    location /nginx_status {
      stub_status on;
      access_log off;
      allow all;
    }

    # otel_trace off overrides the server-level default for this location only.
    # No span is created and no data is sent to the trace backend for requests
    # to /no-trace. Use this pattern for any endpoint you want to exclude
    # from tracing (e.g. health checks, status pages, high-frequency noise).
    location /no-trace {
      otel_trace off;
      return 200 "tracing suppressed\n";
    }

    location / {
      otel_trace_context propagate;

      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;

      proxy_pass http://backend;
    }
  }
}
