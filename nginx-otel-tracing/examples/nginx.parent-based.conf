load_module /usr/local/lib/instana/ngx_otel_module.so;

events {}

error_log /dev/stdout info;

http {
  error_log /dev/stdout info;
  access_log /dev/stdout;

  otel_exporter {
    endpoint instana-collector:4317;
  }

  otel_service_name "nginx-otel-proxy";

  upstream backend {
    server server-app:8080;
  }

  server {
    error_log /dev/stdout info;
    listen 10080;
    server_name localhost;

    location /nginx_status {
      stub_status on;
      access_log off;
      otel_trace off;
      allow all;
    }

    location / {
      # Delegate the sampling decision to the upstream caller.
      # $otel_parent_sampled is 1 when the incoming headers mark the request as
      # sampled, and 0 otherwise. otel_trace_context propagate is required to
      # populate it.
      otel_trace         $otel_parent_sampled;
      otel_trace_context propagate;

      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;

      proxy_pass http://backend;
    }
  }
}
