# Load the Instana nginx OTel tracing module.
# The symlink is created at build time by the Dockerfile, pointing at the
# correct ssl1.1x or ssl3x variant for the base image's OpenSSL version.
load_module /usr/local/lib/instana/ngx_otel_module.so;

events {}

error_log /dev/stdout info;

http {
  error_log /dev/stdout info;
  access_log /dev/stdout;

  # ── OTel exporter ──────────────────────────────────────────────────────────
  # Send traces, metrics, and logs to the local Instana distribution of OTel (IDOT) collector via
  # plain gRPC on port 4317. The collector handles authentication and forwards
  # to the Instana backend via OTLP HTTP.
  # No TLS and no API key header here; the collector's config.yaml carries those.
  otel_exporter {
    endpoint instana-collector:4317;
  }

  # Service identity stamped on every span exported by this nginx instance.
  otel_service_name "nginx-otel-proxy";

  upstream backend {
    server server-app:8080;
  }

  server {
    error_log /dev/stdout info;
    listen 10080;
    server_name localhost;

    # Enable OTel tracing for all requests handled by this server block.
    otel_trace on;

    # nginx stats endpoint — not traced, access log suppressed.
    location /nginx_status {
      stub_status on;
      access_log off;
      otel_trace off;
      allow all;
    }
    location / {
      # propagate: extract W3C traceparent/tracestate from the incoming request
      # (injected by the Instana Java agent on client-app) and inject a new
      # traceparent carrying NGINX's own spanId into the upstream request.
      # This makes the NGINX span the parent of the server-app span.
      # The Instana build of the module also handles Instana proprietary headers
      # (X-INSTANA-T, X-INSTANA-S) natively — no manual stripping required.
      otel_trace_context propagate;

      # Forward the Host header and real client IP to the backend.
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;

      proxy_pass http://backend;
    }
  }
}
