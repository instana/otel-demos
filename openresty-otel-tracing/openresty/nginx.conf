# nginx.conf  --  docker-openresty
#
# This file is installed to:
#   `/usr/local/openresty/nginx/conf/nginx.conf`
# and is the file loaded by nginx at startup,
# unless the user specifies otherwise.
#
# It tracks the upstream OpenResty's `nginx.conf`, but removes the `server`
# section and adds this directive:
#     `include /etc/nginx/conf.d/*.conf;`
#
# The `docker-openresty` file `nginx.vh.default.conf` is copied to
# `/etc/nginx/conf.d/default.conf`.  It contains the `server section
# of the upstream `nginx.conf`.
#
# See https://github.com/openresty/docker-openresty/blob/openresty-otel-tracing/master/README.md#nginx-config-files
#

# Load the Instana NGINX OpenTelemetry module
# The symlink is created at build time by the Dockerfile, pointing at the
# correct ssl1.1x or ssl3x variant for the OpenSSL version of the base image.
load_module /usr/local/lib/instana/ngx_otel_module.so;

#user  nobody;
#worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;



#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # Enables or disables the use of underscores in client request header fields.
    # When the use of underscores is disabled, request header fields whose names contain underscores are marked as invalid and become subject to the ignore_invalid_headers directive.
    # underscores_in_headers off;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

        # Log in JSON Format
        # log_format nginxlog_json escape=json '{ "timestamp": "$time_iso8601", '
        # '"remote_addr": "$remote_addr", '
        #  '"body_bytes_sent": $body_bytes_sent, '
        #  '"request_time": $request_time, '
        #  '"response_status": $status, '
        #  '"request": "$request", '
        #  '"request_method": "$request_method", '
        #  '"host": "$host",'
        #  '"upstream_addr": "$upstream_addr",'
        #  '"http_x_forwarded_for": "$http_x_forwarded_for",'
        #  '"http_referrer": "$http_referer", '
        #  '"http_user_agent": "$http_user_agent", '
        #  '"http_version": "$server_protocol", '
        #  '"nginx_access": true }';
        # access_log /dev/stdout nginxlog_json;

    # See Move default writable paths to a dedicated directory (#119)
    # https://github.com/openresty/docker-openresty/issues/119
    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    # Don't reveal OpenResty version to clients.
    # server_tokens off;


    ##################
    # Instana Config #
    ##################

    upstream backend {
      server server-app:8080;
    }

    # ── OTel exporter ──────────────────────────────────────────────────────────
    # Send traces, metrics, and logs to the local Instana distribution of OTel (IDOT) collector via
    # plain gRPC on port 4317. The collector handles authentication and forwards
    # to the Instana backend via OTLP HTTP.
    # No TLS and no API key header here; the collector's config.yaml carries those.
    otel_exporter {
        endpoint instana-collector:4317;
    }

    # Enable OTel tracing for all requests handled by this server block.
    otel_trace on;
    # Service identity stamped on every span exported by this nginx instance.
    otel_service_name openresty-otel-proxy;

    server {
      error_log /dev/stdout info;
      listen 10080;
      server_name localhost;
      # lua-resty-http needs a DNS resolver. Use the Docker default one.
      resolver 127.0.0.11 valid=30s;
      # NOTE: The DNS resolver does not work for OpenShift. Use a service environment variable,
      # such as `SERVER_APP_SERVICE_HOST` there.

      # nginx stats endpoint — not traced, access log suppressed.
      location /nginx_status {
        stub_status on;
        access_log off;
        otel_trace off;
        allow all;    # don't ever push in production something like this :-)
      }

      location /openresty-otel-demo {
        otel_trace_context propagate;
        proxy_pass http://backend;
      }

      location /lua-otel-demo {
        # propagate: extract W3C traceparent/tracestate from the incoming request
        # (injected by the Instana Java agent on client-app) and inject a new
        # traceparent carrying NGINX's own spanId into the upstream request.
        # This makes the NGINX span the parent of the server-app span.
        # The Instana build of the module also handles Instana proprietary headers
        # (X-INSTANA-T, X-INSTANA-S) natively — no manual stripping required.
        otel_trace_context propagate;

        # Lua code in NGINX HTTP content context starts here.
        # Just forward the HTTP request to the server-app the same way as
        # target /openresty-otel-demo does, but use lua-resty-http for this
        # and drop all incoming headers. Let lua-resty-http add the traceparent header
        # from ngx.var.http_traceparent NGINX variable.
        content_by_lua_block {
          local http = require "resty.http"

          local httpc = http.new()
          local res, err = httpc:request_uri("http://server-app:8080", {
            method = "GET",
          })

          if not res then
            ngx.status = ngx.HTTP_BAD_GATEWAY
            ngx.header["Content-Type"] = "text/plain; charset=utf-8"
            ngx.say("failed to call upstream: ", err)
            return
          end

          ngx.status = res.status
          if res.headers["Content-Type"] then
            ngx.header["Content-Type"] = res.headers["Content-Type"]
          end
          ngx.say(res.body)
        }
      }
    }
}

#include /etc/nginx/conf.d/*.main;
