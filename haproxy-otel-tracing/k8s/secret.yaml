---
apiVersion: v1
kind: Secret
metadata:
  name: instana-credentials
  namespace: haproxy-otel
  labels:
    app.kubernetes.io/part-of: haproxy-otel-tracing
type: Opaque
stringData:
  # ── Required ──────────────────────────────────────────────────────────────
  # Instana agent key (found in Instana UI → More → Agents → Install Agent)
  INSTANA_KEY: ""

  # Backend OTLPhttp endpoint, e.g. https://<unit>.instana.io:443
  INSTANA_OTEL_ENDPOINT_HTTP: ""

  # Logical host name reported to Instana (free-form, e.g. cluster node name)
  INSTANA_HOST_NAME: ""

  # ── Optional ──────────────────────────────────────────────────────────────
  # Collector / SDK service version label
  INSTANA_OTEL_SERVICE_VERSION: "1.317.1"

  # Collector internal log level: debug | info | warn | error
  INSTANA_OTEL_LOG_LEVEL: "info"

  # OTel SDK debug verbosity: none | basic | normal | detailed
  OTEL_DEBUG_VERBOSITY: "detailed"
