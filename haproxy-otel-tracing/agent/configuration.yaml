# Java Tracing
com.instana.plugin.javatrace:
  instrumentation:
    # Lightweight Bytecode Instrumentation, enabled by default
    # Disabling currently requires an agent restart
    enabled: true
  # Inject W3C traceparent/tracestate in addition to Instana headers.
  # This allows HAProxy's OTel filter (extract "-" use-headers) to read the
  # parent trace context and create a child span rather than a new root span.
  propagation:
    - style: W3C
    - style: INSTANA

